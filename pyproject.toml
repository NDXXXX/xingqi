[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zhiyu-agent"
version = "0.1.0"
description = "知语 Personal AI Agent CLI"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "filelock>=3.15",
    "pydantic>=2.6",
    "sqlalchemy>=2.0",
    "httpx>=0.27",
    "keyring>=25",
    "langgraph>=0.2",
    "mcp>=1.0",
    "websockets>=15",
    "python-dotenv>=1.2.3",
    "textual>=8.2.8",
    "fastapi>=0.124",
    "uvicorn>=0.38",
]

[project.scripts]
zhiyu = "zhiyu.cli.main:main"

[dependency-groups]
dev = [
    "pyinstaller>=6.0",
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/zhiyu"]
